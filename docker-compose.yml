services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: printease:latest
    container_name: printease-app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - printease_data:/var/www/html/database
      - printease_storage:/var/www/html/storage/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_NAME=PrintEase
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
      - FILESYSTEM_DISK=local

volumes:
  printease_data:
    driver: local
  printease_storage:
    driver: local
